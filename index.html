    <script>
      // Suppress benign Vite HMR WebSocket errors in sandbox iframe environment (as per platform constraints)
      (function() {
        // 1. Intercept window.WebSocket for Vite HMR so it stays connected cleanly and never errors
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          function FakeHmrWebSocket(url, protocols) {
            var self = this;
            this.url = url;
            this.protocol = Array.isArray(protocols) ? protocols[0] : (protocols || 'vite-hmr');
            this.readyState = 1; // WebSocket.OPEN
            this.binaryType = 'blob';
            this.bufferedAmount = 0;
            this.extensions = '';

            var listeners = {};
            this.addEventListener = function(type, fn) {
              if (!listeners[type]) listeners[type] = [];
              listeners[type].push(fn);
            };
            this.removeEventListener = function(type, fn) {
              if (!listeners[type]) return;
              listeners[type] = listeners[type].filter(function(l) { return l !== fn; });
            };
            this.dispatchEvent = function(evt) {
              var list = listeners[evt.type] || [];
              for (var i = 0; i < list.length; i++) {
                try { list[i].call(self, evt); } catch (_) {}
              }
              var onHandler = self['on' + evt.type];
              if (typeof onHandler === 'function') {
                try { onHandler.call(self, evt); } catch (_) {}
              }
              return true;
            };
            this.send = function() {};
            this.close = function(code, reason) {
              self.readyState = 3; // CLOSED
              setTimeout(function() {
                self.dispatchEvent({ type: 'close', wasClean: true, code: code || 1000, reason: reason || '' });
              }, 0);
            };

            setTimeout(function() {
              self.dispatchEvent({ type: 'open' });
            }, 5);
          }

          FakeHmrWebSocket.prototype.CONNECTING = 0;
          FakeHmrWebSocket.prototype.OPEN = 1;
          FakeHmrWebSocket.prototype.CLOSING = 2;
          FakeHmrWebSocket.prototype.CLOSED = 3;

          window.WebSocket = function(url, protocols) {
            var isHmr = false;
            if (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('@vite') !== -1)) {
              isHmr = true;
            }
            if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) {
              isHmr = true;
            }
            if (isHmr) {
              return new FakeHmrWebSocket(url, protocols);
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // 2. Fallback console and event error suppression
        function isViteHmrError(args) {
          if (!args || !args.length) return false;
          var combined = '';
          for (var i = 0; i < args.length; i++) {
            var arg = args[i];
            if (!arg) continue;
            if (typeof arg === 'string') {
              combined += ' ' + arg;
            } else if (arg instanceof Error) {
              combined += ' ' + (arg.message || '') + ' ' + (arg.stack || '');
            } else if (typeof arg === 'object') {
              try {
                combined += ' ' + (arg.message || JSON.stringify(arg));
              } catch (_) {
                combined += ' ' + String(arg);
              }
            }
          }
          return (
            combined.includes('WebSocket closed without opened') ||
            combined.includes('[vite] WebSocket') ||
            (combined.includes('[vite]') && combined.includes('WebSocket')) ||
            combined.includes('failed to connect to websocket')
          );
        }

        var origConsoleError = console.error;
        console.error = function() {
          if (isViteHmrError(arguments)) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          if (isViteHmrError(arguments)) {
            return;
          }
          origConsoleWarn.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || (event.error && event.error.message))) || '';
          if (typeof msg === 'string' && (msg.includes('WebSocket closed without opened') || (msg.includes('[vite]') && msg.includes('WebSocket')))) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (typeof msg === 'string' && (msg.includes('WebSocket closed without opened') || (msg.includes('[vite]') && msg.includes('WebSocket')))) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
